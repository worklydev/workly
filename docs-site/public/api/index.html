<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>API reference | Workly</title>
    <link rel="icon" href="/docs/favicon.svg" type="image/svg+xml" />
    <style>
      body { margin: 0; }
      .back {
        display: block;
        padding: 10px 16px;
        font: 14px system-ui, sans-serif;
        color: oklch(0.5 0 0);
        text-decoration: none;
        border-bottom: 1px solid oklch(0 0 0 / 8%);
      }
      .back:hover { color: oklch(0.58 0.19 45); }
    </style>
  </head>
  <body>
    <a class="back" href="/docs/">← Workly docs</a>
    <div id="app"></div>
    <!-- openapi.yaml is copied here from api/ when the site builds (scripts/sync.mjs). -->
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.72.2"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: '/docs/api/openapi.yaml',
        hideClientButton: true,
        withDefaultFonts: false,
        showDeveloperTools: 'never',
        agent: { disabled: true },
        mcp: { disabled: true },
      });
    </script>
  </body>
</html>

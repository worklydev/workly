# Weekly dependency updates, grouped so each ecosystem opens one PR for
# minor and patch bumps. Majors come separately.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /dashboard
    schedule: {interval: weekly}
    groups:
      dashboard:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /sdks/python
    schedule: {interval: weekly}
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions:
        update-types: [minor, patch]

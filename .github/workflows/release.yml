# Tagging vX.Y.Z releases the server: binaries on GitHub releases, the
# ghcr.io/worklydev/workly image, and the same binaries as workly-cli wheels
# on PyPI.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  github:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write # ghcr.io image
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # goreleaser builds the changelog from history
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: docker/setup-buildx-action@v4 # multi-platform image push
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build workly-cli wheels
        run: python3 packaging/pypi/build_wheels.py

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/pypi/

  pypi:
    needs: github
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing; no API token stored
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: wheels
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

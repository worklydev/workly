name: server

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "api/**"
      - "internal/**/migrations/**"
      - "internal/*/oapi-codegen.yaml"
      - ".github/workflows/server.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: workly
          POSTGRES_PASSWORD: workly
          POSTGRES_DB: workly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workly"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- internal/api/gen.go internal/client/gen.go

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: Test (SQLite + Postgres)
        env:
          WORKLY_TEST_POSTGRES_URL: postgres://workly:workly@localhost:5432/workly?sslmode=disable
        run: go test -race ./...

      - name: Build
        run: go build ./cmd/workly

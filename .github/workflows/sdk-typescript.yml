name: sdk-typescript

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "sdks/typescript/**"
      - "api/openapi.yaml"
      - "internal/**"
      - "cmd/**"
      - ".github/workflows/sdk-typescript.yml"

defaults:
  run:
    working-directory: sdks/typescript

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci

      - name: Type-check, lint and format
        run: npm run check

      # Integration tests build and run the server from this commit.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build && npm pack --dry-run
